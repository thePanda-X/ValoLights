[package]
name = "vl-speech"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
log = "0.4.35"
regex = "1.13.2"
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.2"
vl-core = { version = "0.3.0", path = "../vl-core" }
vl-render = { version = "0.3.0", path = "../vl-render" }
whisper-rs = "0.16"

[features]
default = ["cuda"]
# whisper.cpp with CUDA (needs the CUDA toolkit, CMake and libclang at build time; see docs/development.md)
cuda = ["whisper-rs/cuda"]

[[bin]]
name = "vl-speech"
path = "src/main.rs"

[lints]
workspace = true
