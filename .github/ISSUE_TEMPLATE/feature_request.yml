name: Feature request
description: An idea to make ValoLights better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation or the clip you were making, and what was missing.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. Mock-ups and examples from other editors are welcome.
