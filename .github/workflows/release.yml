name: Release

# Push a tag like v0.3.0 (matching the version in Cargo.toml) to build the Windows installer, sign the update
# manifest and publish a GitHub release. The app checks
# https://github.com/<owner>/<repo>/releases/latest/download/latest.json for updates.
#
# Needs the repository secret UPDATE_SIGNING_KEY (see docs/releasing.md).
#
# Every Monday (and when run by hand without a tag) it only builds and self-tests main, publishing nothing. That keeps the build cache
# (mostly whisper.cpp's CUDA kernels, about an hour to compile from scratch) from expiring: GitHub deletes
# caches that go unused for 7 days. Caches are saved from main only, so release tags can restore them.

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.3.0 (empty: only build and self-test main)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # tag pushes and runs given a tag publish; the Monday run and runs without a tag only build
  PUBLISH: ${{ github.event_name == 'push' || (github.event.inputs.tag || '') != '' }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Version from the tag
        if: env.PUBLISH == 'true'
        id: version
        shell: powershell
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "tag $env:TAG does not match the version in Cargo.toml ($v)" }
          "version=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore third-party binaries and models
        uses: actions/cache/restore@v6
        with:
          path: |
            bin
            assets/ocr/*.onnx
            assets/audio/*.onnx
            assets/audio/LICENSE-yamnet.txt
            build/tools
          key: binaries-${{ hashFiles('tools/fetch_binaries.ps1', 'tools/rife/**') }}

      # whisper.cpp's CUDA kernels (vl-speech): compiler, runtime, cuBLAS and the Visual Studio integration.
      # NVIDIA's redistributable archives (SHA-256 from their manifest) unpacked where a normal install puts
      # them; the network installer fails silently on the runners.
      - name: Install the CUDA toolkit 13.2
        shell: powershell
        run: |
          $ProgressPreference = "SilentlyContinue"
          $base = "https://developer.download.nvidia.com/compute/cuda/redist"
          $manifest = Invoke-RestMethod "$base/redistrib_13.2.0.json"
          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2"
          New-Item -ItemType Directory -Force $cuda | Out-Null
          foreach ($c in "cuda_nvcc", "cuda_cudart", "cuda_crt", "libnvvm", "cuda_cccl", "libcublas", "visual_studio_integration") {
            $a = $manifest.$c."windows-x86_64"
            if (-not $a) { throw "$c is not in the CUDA 13.2 manifest" }
            $zip = Join-Path $env:RUNNER_TEMP "$c.zip"
            & curl.exe -fsSL --retry 5 --retry-all-errors -o $zip "$base/$($a.relative_path)"
            if ($LASTEXITCODE -ne 0) { throw "could not download $c" }
            if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $a.sha256) { throw "$c failed the SHA-256 check" }
            $x = Join-Path $env:RUNNER_TEMP $c
            & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw "could not unpack $c" }
            $dir = Get-ChildItem $env:RUNNER_TEMP -Directory -Filter "$c-windows-x86_64-*-archive" | Select-Object -First 1
            Copy-Item "$($dir.FullName)\*" $cuda -Recurse -Force
            Write-Host "$c $($manifest.$c.version)"
          }
          if (-not (Test-Path "$cuda\bin\nvcc.exe")) { throw "nvcc not found in $cuda" }
          # MSBuild's CUDA support, for every Visual Studio toolset on the runner
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $targets = Get-Item "$vs\MSBuild\Microsoft\VC\*\BuildCustomizations"
          if (-not $targets) { throw "no Visual Studio BuildCustomizations folder under $vs" }
          foreach ($t in $targets) { Copy-Item "$cuda\visual_studio_integration\MSBuildExtensions\*" $t.FullName -Recurse -Force; Write-Host "CUDA MSBuild integration -> $($t.FullName)" }
          "CUDA_PATH=$cuda" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CUDA_PATH_V13_2=$cuda" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$cuda\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$cuda\bin\x64" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$cuda\bin\nvcc.exe" --version

      # nvcc has to work with the MSVC toolset that builds whisper.cpp's CUDA kernels. Runner image
      # win25-vs2026 20261116 made MSVC 14.52 the default, and CUDA 13.2's front end crashes with it (cudafe++
      # 0xC0000005). Compile a small kernel with each toolset on the runner, newest first, and pin the first one
      # that works: MSBuild takes VCToolsVersion from the environment (outside a developer command prompt).
      - name: MSVC toolset for CUDA
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = "$vs\VC\Auxiliary\Build\vcvars64.bat"
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Where-Object { Test-Path "$($_.FullName)\bin\Hostx64\x64\cl.exe" } | Sort-Object { [version]$_.Name } -Descending
          Write-Host "MSVC toolsets with cl.exe: $($tools.Name -join ', ')"
          $dir = Join-Path $env:RUNNER_TEMP "cuda-probe"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Content -Encoding ascii "$dir\probe.cu" "#include <cstdio>`n__global__ void k(float* x) { x[threadIdx.x] *= 2.0f; }`nint main() { std::printf(`"ok\n`"); return 0; }"
          $pick = $null
          foreach ($t in $tools) {
            $out = cmd /c "`"$vcvars`" -vcvars_ver=$($t.Name) >nul 2>&1 && nvcc --use-local-env -c `"$dir\probe.cu`" -o `"$dir\probe.obj`" 2>&1"
            if ($LASTEXITCODE -eq 0) { $pick = $t.Name; break }
            Write-Host "MSVC $($t.Name): nvcc failed: $(($out | Select-Object -Last 3) -join ' | ')"
          }
          if (-not $pick) { throw "no MSVC toolset on the runner works with this CUDA" }
          Write-Host "CUDA host compiler: MSVC $pick"
          "VCToolsVersion=$pick" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # CMake caches from the build cache that point at compilers the runner image no longer has: whisper.cpp's
      # CMakeCache.txt kept MSVC 14.51 paths after the image moved to 14.52, and CMake doesn't look again. Same as
      # tools/ci_stale_cmake.ps1 (used by CI), written out here because runs given an older tag check out code
      # that doesn't have the script; keep the two in step.
      - name: Drop stale CMake caches
        shell: powershell
        run: |
          $caches = Get-ChildItem target -Directory -ErrorAction SilentlyContinue | ForEach-Object { Join-Path $_.FullName "build" } |
            Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem $_ -Recurse -Depth 4 -Filter CMakeCache.txt -File -ErrorAction SilentlyContinue }
          $dropped = 0
          foreach ($c in $caches) {
            $missing = @()
            foreach ($line in Get-Content $c.FullName) {
              if ($line -match '^(CMAKE_\w*(COMPILER|LINKER|_AR|_MT|_RC_COMPILER))(:\w+)?=(.+)$') {
                $name, $path = $matches[1], $matches[4].Trim()
                if ($path -match '^[A-Za-z]:[\\/]' -and -not (Test-Path -LiteralPath $path)) { $missing += "$name = $path" }
              }
            }
            if ($missing) {
              Write-Host "stale CMake cache $($c.FullName):"
              $missing | ForEach-Object { Write-Host "  missing $_" }
              Remove-Item -LiteralPath $c.FullName -Force
              $files = Join-Path $c.DirectoryName "CMakeFiles"
              if (Test-Path $files) { Remove-Item -LiteralPath $files -Recurse -Force }
              $dropped++
            }
          }
          Write-Host "$(@($caches).Count) CMake caches checked, $dropped dropped"

      - name: Install Inno Setup
        if: env.PUBLISH == 'true'
        run: choco install innosetup -y --no-progress

      - name: Build and self-test the app (build only)
        if: env.PUBLISH != 'true'
        shell: powershell
        run: ./build/build.ps1

      - name: Build and self-test the app, then the installer
        if: env.PUBLISH == 'true'
        shell: powershell
        run: ./build/installer.ps1

      - name: Release notes from CHANGELOG.md
        if: env.PUBLISH == 'true'
        shell: powershell
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $lines = Get-Content -Encoding UTF8 CHANGELOG.md   # Windows PowerShell reads BOM-less files as ANSI otherwise
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($v))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $v" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern "^## \[" | Select-Object -First 1).LineNumber
          $notes = if ($end) { $rest[0..($end - 2)] } else { $rest }
          # UTF-8 without a byte order mark (Out-File -Encoding utf8 adds one in Windows PowerShell)
          [IO.File]::WriteAllText((Join-Path $PWD "dist\notes.md"), ($notes -join "`n").Trim(), (New-Object Text.UTF8Encoding $false))

      - name: Signed update manifest (latest.json)
        if: env.PUBLISH == 'true'
        shell: powershell
        env:
          VALOLIGHTS_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:VALOLIGHTS_UPDATE_KEY) { throw "the UPDATE_SIGNING_KEY secret is not set" }
          $v = "${{ steps.version.outputs.version }}"
          $setup = "dist\ValoLights-Setup-$v.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/ValoLights-Setup-$v.exe"
          # valolights.exe is a GUI-subsystem program: PowerShell doesn't wait for it unless told to
          $cli = @("cli", "release-manifest", "--installer", $setup, "--version", $v, "--url", $url, "--notes", "dist\notes.md", "-o", "dist\latest.json")
          $p = Start-Process target\release\valolights.exe -ArgumentList $cli -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -or -not (Test-Path dist\latest.json)) { throw "release-manifest failed ($($p.ExitCode))" }
          Get-Content dist\latest.json

      - name: Publish the release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ValoLights ${{ env.TAG }}
          body_path: dist/notes.md
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            dist/ValoLights-Setup-${{ steps.version.outputs.version }}.exe
            dist/latest.json
